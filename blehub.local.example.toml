# Copy this file to blehub.local.toml and adjust paths for this machine.
# Only machine-local paths belong here; versions and hashes remain in tracked scripts/locks.
# BLEHUB_ANDROID_ROOT and BLEHUB_QEMU_ROOT override these values for one-off
# runs. Android also honors ANDROID_HOME and
# ANDROID_SDK_ROOT, then defaults to the platform's shared Android SDK location.
# Project-managed toolchains fall back to ~/.cache/blehub/toolchains/<name>.
# QEMU is a host-shared dependency: leave qemu_root unset to use the host
# package-manager/PATH installation or the platform shared-user fallback.
# BLEHUB_MUTAGEN_EXE/HOST/USER/REMOTE_PATH/SESSION_NAME override the
# corresponding [mutagen] values. BLEHUB_PERIPHERAL_USB_* override the
# corresponding [peripheral_usb] values. BLEHUB_NRFTEST_ROOT and
# BLEHUB_NRF52840_PORT override the external nRF52840 provider. BLEHUB_APPLE_DEVICE,
# BLEHUB_APPLE_DEVELOPMENT_TEAM, and BLEHUB_APPLE_IOS_PROBE_BUNDLE_ID can
# disambiguate iPhone device-signing runs; the normal single-device/single-paid-
# team setup is detected automatically. The Apple Team ID may also be kept in
# the ignored [apple] table below; it is intentionally not part of tracked
# XcodeGen project settings.

[apple]
# development_team = "YOUR10CHARTEAM"

[toolchains]
# Swift is supplied by the selected macOS Xcode installation. Leave android_root
# unset to share the standard Android SDK with Android Studio and other projects.
# Platform defaults are ~/Library/Android/sdk on macOS,
# %LOCALAPPDATA%/Android/Sdk on Windows, and ~/Android/Sdk on Linux.
# android_root = "~/Library/Android/sdk"
# qemu_root = "/path/to/shared/qemu"
# nrftest_root = "/path/to/nrftest"

[peripheral_nrf52840]
# Optional when nrftest.local.toml already selects the unique application device.
# port = "/dev/cu.usbmodem..."

[peripheral_usb]
# Configure only after the physical controller and its firmware mode are known.
# vendor_id = "0000"
# product_id = "0000"
# serial = "device-serial"
# qmp_id = "ble-controller"
# bus = "xhci.0"

[mutagen]
executable = "mutagen"
host = "dev-host.example"
user = "developer"
remote_path = "~/projects/blehub"
session_name = "blehub"
