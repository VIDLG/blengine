import com.android.build.api.dsl.LibraryExtension

plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}

ext.minSdkVersion = 24
ext.targetSdkVersion = 36
ext.compileSdkVersion = 36
ext.ndkVersion = '28.2.13676358'

def reactNativeArchitectures() {
  def value = rootProject.findProperty('reactNativeArchitectures')
  return value ? value.split(',') : ['arm64-v8a', 'x86_64']
}

def nitroPrefabFix = rootProject.file('../node_modules/react-native-nitro-modules/android/fix-prefab.gradle')
if (!nitroPrefabFix.isFile()) {
  nitroPrefabFix = file('../node_modules/react-native-nitro-modules/android/fix-prefab.gradle')
}
apply from: nitroPrefabFix

android {
  namespace 'com.blehub.reactnative.bleng'
  compileSdk 36
  buildToolsVersion '36.0.0'
  ndkVersion '28.2.13676358'

  defaultConfig {
    minSdk 24

    consumerProguardFiles 'consumer-rules.pro'
    externalNativeBuild {
      cmake {
        cppFlags '-frtti -fexceptions -Wall -Wextra -fstack-protector-all'
        arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
        // Match Nitro's native slices instead of configuring AGP's default four ABIs.
        abiFilters (*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
      version '3.22.1'
    }
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  packaging {
    jniLibs.pickFirsts += [
      '**/libc++_shared.so',
      '**/libfbjni.so',
      '**/libjsi.so',
      '**/libreactnative.so',
    ]
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

kotlin {
  jvmToolchain(17)
  sourceSets {
    main.kotlin.srcDir('../nitrogen/generated/android/kotlin')
  }
}

dependencies {
  api 'dev.blehub:bleng:0.0.0'
  api('dev.blehub:blehub-android:0.0.0') {
    exclude group: 'dev.blehub', module: 'blehub-uniffi'
  }
  api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
  implementation 'com.facebook.react:react-android:0.87.1'
  api project(':react-native-nitro-modules')
  implementation 'androidx.annotation:annotation:1.9.1'

}

allprojects {
  layout.buildDirectory.set(rootProject.file("../../../.work/react-native-bleng-android/${project.name}"))
  configurations.configureEach {
    resolutionStrategy.eachDependency {
      if (requested.group == 'com.facebook.react' && requested.name == 'react-native') {
        useTarget 'com.facebook.react:react-android:0.87.1'
      }
    }
  }
}

subprojects {
  afterEvaluate {
    extensions.findByType(LibraryExtension)?.compileOptions {
      sourceCompatibility JavaVersion.VERSION_17
      targetCompatibility JavaVersion.VERSION_17
    }
  }
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = '17'
  }
}
