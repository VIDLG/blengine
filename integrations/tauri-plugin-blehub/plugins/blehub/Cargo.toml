[package]
name = "tauri-plugin-blehub"
links = "tauri-plugin-blehub"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["native"]
native = ["dep:blehub-windows"]

[dependencies]
blehub = { path = "../../../../crates/blehub" }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
tauri = "2.11.5"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
swift-rs = "1.0.8"

[target.'cfg(target_os = "windows")'.dependencies]
blehub-windows = { path = "../../../../platforms/windows", optional = true }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.build-dependencies]
swift-rs = { version = "1.0.8", features = ["build"] }

[dev-dependencies]
serde_json = "1"
tauri = { version = "2.11.5", features = ["test"] }
blehub-testkit = { path = "../../../../tests/support/blehub-testkit" }
