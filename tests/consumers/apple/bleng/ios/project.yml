name: BlengIOSArtifactConsumer
options:
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.2"
packages:
  BleHubUniFfi:
    path: ../../../../../.work/staged/apple-bleng
targets:
  BlengIOSArtifactConsumer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: ../macos/Sources/BlengArtifactConsumer/TypedOperations.swift
        buildPhase: sources
      - path: Info.plist
        buildPhase: none
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: dev.blehub.bleng-ios-artifact-consumer
        PRODUCT_NAME: BlengIOSArtifactConsumer
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - package: BleHubUniFfi
        product: BleHubUniFfi
schemes:
  BlengIOSArtifactConsumer:
    build:
      targets:
        BlengIOSArtifactConsumer: all
    run:
      config: Debug
