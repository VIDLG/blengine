name: Phase 0 Apple

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/phase0-apple.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "just/**"
      - "justfile"
      - "pixi.lock"
      - "pixi.toml"
      - "spikes/boltffi-token-ingress/**"
      - "spikes/uniffi-lifecycle/**"
      - "tools/boltffi_toolchain.py"
      - "tools/package_uniffi_apple.py"
      - "tools/run_boltffi_cli.py"
      - "tools/test_boltffi_apple_package.py"
      - "tools/test_swift_macos.py"
      - "tools/test_uniffi_apple_package.py"
      - "tools/test_uniffi_swift_macos.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase0-apple.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "just/**"
      - "justfile"
      - "pixi.lock"
      - "pixi.toml"
      - "spikes/boltffi-token-ingress/**"
      - "spikes/uniffi-lifecycle/**"
      - "tools/boltffi_toolchain.py"
      - "tools/package_uniffi_apple.py"
      - "tools/run_boltffi_cli.py"
      - "tools/test_boltffi_apple_package.py"
      - "tools/test_swift_macos.py"
      - "tools/test_uniffi_apple_package.py"
      - "tools/test_uniffi_swift_macos.py"

permissions:
  contents: read

concurrency:
  group: phase0-apple-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  boltffi-macos-runtime-and-packaging:
    name: BoltFFI macOS runtime and Apple package
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out BleHub
        uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.67.2
          cache: true
          environments: apple-ci

      - name: Install pinned official BoltFFI CLI
        run: pixi run -e apple-ci just boltffi-bootstrap

      - name: Record macOS gate environment
        run: |
          mkdir -p .work/reports
          {
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
            pixi --version
            pixi run -e apple-ci rustc --version
            pixi run -e apple-ci cargo --version
            pixi run -e apple-ci just boltffi-report
          } 2>&1 | tee .work/reports/boltffi-apple-environment.log

      - name: Run BoltFFI Darwin Swift runtime and ARC smoke
        run: |
          pixi run -e apple-ci just ffi-phase0-test-swift-macos \
            2>&1 | tee .work/reports/boltffi-macos-runtime.log

      - name: Build BoltFFI XCFramework and test SPM consumers
        run: |
          pixi run -e apple-ci just ffi-phase0-test-apple-package-consumer \
            2>&1 | tee .work/reports/boltffi-apple-package.log

      - name: Upload BoltFFI Apple gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boltffi-apple-gate-${{ runner.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            .work/reports/boltffi-apple-*.log
            .work/reports/boltffi-macos-runtime.log
            spikes/boltffi-token-ingress/generated/apple/

  uniffi-macos-runtime-and-packaging:
    name: UniFFI macOS runtime and Apple package
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out BleHub
        uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.67.2
          cache: true
          environments: apple-ci

      - name: Record macOS gate environment
        run: |
          mkdir -p .work/reports
          {
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
            pixi --version
            pixi run -e apple-ci rustc --version
            pixi run -e apple-ci cargo --version
          } 2>&1 | tee .work/reports/uniffi-apple-environment.log

      - name: Run stable UniFFI Darwin Swift runtime and ARC smoke
        run: |
          pixi run -e apple-ci just ffi-spike-test-uniffi-swift-macos \
            2>&1 | tee .work/reports/uniffi-macos-runtime.log

      - name: Build stable UniFFI XCFramework and test SPM consumers
        run: |
          pixi run -e apple-ci just ffi-spike-test-uniffi-apple-package-consumer \
            2>&1 | tee .work/reports/uniffi-apple-package.log

      - name: Upload stable UniFFI Apple gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-apple-gate-${{ runner.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            .work/reports/uniffi-apple-*.log
            .work/reports/uniffi-macos-runtime.log
            spikes/uniffi-lifecycle/generated/apple/
