name: Deferred Apple production candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deferred-apple-production-candidate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  production-candidate-macos-runtime:
    name: Stable UniFFI production candidate on macOS
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out BleHub
        uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.67.2
          cache: true
          environments: apple-ci

      - name: Record macOS environment
        run: |
          mkdir -p .work/reports
          {
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
            pixi --version
            pixi run -e apple-ci rustc --version
            pixi run -e apple-ci cargo --version
          } 2>&1 | tee .work/reports/uniffi-production-candidate-apple-environment.log

      - name: Run production-candidate Darwin Swift object-graph gate
        run: |
          pixi run -e apple-ci just spike swift-macos \
            2>&1 | tee .work/reports/uniffi-production-candidate-macos-runtime.log

      - name: Upload production-candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-production-candidate-macos-${{ runner.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            .work/reports/uniffi-production-candidate-*.log
            spikes/uniffi-production-candidate/generated/swift-macos/
