# Publish the generated TypeDoc reference as the repository's GitHub Pages site.
#
# The site is a generated artifact: nothing is committed, nothing is edited. `docs-checks.yml` is the
# gate for the same inputs; this workflow only builds and deploys it.
#
# Hosting is already provisioned: Pages is enabled for this repository with "GitHub Actions" as the
# source, and the repository is public, so deployment is entitled. The push trigger below publishes
# on `main` when the API surface or its documentation inputs change; `workflow_dispatch` stays for
# manual republishing. The site lives at https://vidlg.github.io/blengine/ (a project page).
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "integrations/react-native-bleng/specs/**"
      - "integrations/react-native-bleng/src/**"
      - "integrations/react-native-bleng/typedoc.json"
      - "integrations/react-native-bleng/typedoc-readme.md"
      - "integrations/react-native-bleng/package*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

# The official Pages template permissions: build reads, deploy writes Pages with an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a publish that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integrations/react-native-bleng/package-lock.json

      - name: Install documentation tooling
        run: npm ci --no-audit --no-fund

      - name: Install package type dependencies
        working-directory: integrations/react-native-bleng
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the site
        run: npm run docs:api

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: integrations/react-native-bleng/site/api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
