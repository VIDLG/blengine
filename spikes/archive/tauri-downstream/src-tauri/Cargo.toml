[package]
name = "blehub-tauri-spike"
version = "0.0.0"
edition = "2024"
publish = false

[build-dependencies]
swift-rs = { version = "1.0.8", features = ["build"] }
tauri-build = "2.5.2"

[features]
default = []
wdio = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
blehub = { path = "../../../crates/blehub" }
blehub-tauri-plugin-spike = { path = "../plugins/blehub" }
blehub-testkit = { path = "../../../tests/support/blehub-testkit" }
swift-rs = "1.0.8"
tauri = "2.11.5"

[dependencies.tauri-plugin-wdio-webdriver]
version = "1.3.0"
optional = true
