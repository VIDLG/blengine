[package]
name = "blehub_boltffi_lifecycle_spike"

[targets.android]
enabled = true
min_sdk = 24
architectures = ["arm64", "x86_64"]

[targets.android.kotlin]
package = "dev.blehub.spike"
output = "generated/kotlin"
error_style = "throwing"

[targets.android.pack]
output = "generated/android-jni"

[targets.apple]
enabled = true
include_macos = true
deployment_target = "16.0"

[targets.apple.xcframework]
output = "generated/apple/BleHubLifecycleSpike.xcframework"

[targets.apple.spm]
output = "generated/apple"
layout = "split"

[targets.apple.swift]
module_name = "BleHubLifecycleSpike"
output = "generated/swift"
error_style = "throwing"
