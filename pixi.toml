[workspace]
name = "blehub"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.12,<3.14"
7zip = "26.02.*"
just = ">=1.38,<2"
tqdm = ">=4.67,<5"
ruff = ">=0.16.5,<0.17"
httpx = ">=0.28.1,<0.29"
pooch = ">=1.8,<2"
hishel = ">=1,<2"
nodejs = ">=22,<27"
rtk-cli = ">=0.46,<0.47"
sccache = ">=0.16,<0.18"

[feature.rust.dependencies]
rust = "1.95.*"
rust-src = "1.95.*"

[feature.jvm.dependencies]
openjdk = "17.*"
gradle = "8.11.*"
kotlin = "2.1.20.*"


[feature.android.dependencies]
openjdk = "17.*"
rust-std-aarch64-linux-android = "1.95.*"
rust-std-x86_64-linux-android = "1.95.*"

[feature.apple-ci.dependencies]
rust-std-aarch64-apple-ios = "1.95.*"
rust-std-aarch64-apple-ios-sim = "1.95.*"
rust-std-x86_64-apple-ios = "1.95.*"

[feature.apple-ci.target.osx-64.dependencies]
rust-std-aarch64-apple-darwin = "1.95.*"

[feature.apple-ci.target.osx-arm64.dependencies]
rust-std-x86_64-apple-darwin = "1.95.*"


[environments]
default = { features = ["rust"], solve-group = "development" }
jvm = { features = ["rust", "jvm"], solve-group = "development" }
android = { features = ["rust", "jvm", "android"], solve-group = "development" }
apple-ci = { features = ["rust", "apple-ci"], solve-group = "development" }

[activation.env]
RUSTC_WRAPPER = "sccache"
CARGO_INCREMENTAL = "0"

[target.win-64.dependencies]
packer = "1.16.0.*"
"qemu.qmp" = "0.0.6.*"

[target.unix.dependencies]
packer = "1.16.0.*"
"qemu.qmp" = "0.0.6.*"

[target.win-64.activation.env]
CARGO_HOME = "%USERPROFILE%\\.cache\\mobile-ffi-toolchain\\cargo-home"
CARGO_TARGET_DIR = "%PIXI_PROJECT_ROOT%\\.work\\cargo-target"

[target.unix.activation.env]
CARGO_HOME = "$HOME/.cache/mobile-ffi-toolchain/cargo-home"
CARGO_TARGET_DIR = "$PIXI_PROJECT_ROOT/.work/cargo-target"

[pypi-dependencies]
bleak = ">=1, <2"
pyserial = ">=3.5, <4"
