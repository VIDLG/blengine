[workspace]
members = ["crates/blehub", "crates/blehub-testkit"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
arc-swap = "1.7"
boltffi = "=0.30.1"
derive_more = { version = "2.0.1", features = ["display", "error"] }
