[workspace]
members = [
    "crates/blehub",
    "crates/bleng",
    "crates/bleng-uniffi",
    "crates/blehub-uniffi",
    "platforms/windows",
    "tests/support/blehub-testkit",
]
exclude = ["tests/hil/windows"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
delegate = "=0.13.5"
derive_more = { version = "=2.1.1", default-features = false, features = ["from", "into", "try_from"] }
kameo = "=0.22.2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = "0.1"
uniffi = "=0.32.0"
uuid = "1"
windows-future = "0.3"
windows = { version = "0.62", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }
