[workspace]
members = ["crates/blehub", "crates/blehub-testkit", "crates/blehub-windows"]
exclude = ["tests/hil/windows"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
uniffi = "=0.32.0"
uuid = "1"
windows-future = "0.3"
windows = { version = "0.62", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }
