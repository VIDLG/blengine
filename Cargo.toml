[workspace]
members = [
    "crates/blehub",
    "crates/bleng",

    "crates/bleng-supervisor",
    "crates/bleng-uniffi",
    "crates/blehub-uniffi",
    "tests/support/blehub-testkit",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
async-trait = "=0.1.89"
delegate = "=0.13.5"
derive_more = { version = "=2.1.1", default-features = false, features = ["display", "from", "into", "try_from"] }
getset = "=0.1.7"
kameo = "=0.22.2"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
scopeguard = { version = "=1.2.0", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }
tracing = "0.1"
uniffi = "=0.32.0"
uuid = "1"
